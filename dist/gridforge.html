<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Gridforge — a 3D electricity-network strategy game. Stage 1: Light the First District." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230b1626%22/%3E%3Cpath d=%22M18 4 8 18h7l-2 10 11-15h-8z%22 fill=%22%23d4ff3a%22/%3E%3C/svg%3E" />
<title>Gridforge — Light the First District</title>
<style>:root {
  --scale: 1;
  --bg: #0d0b09;
  --panel: linear-gradient(180deg, rgba(50, 42, 34, 0.93), rgba(31, 26, 21, 0.93));
  --panel-solid: #221d18;
  --panel-2: rgba(255, 236, 205, 0.06);
  --line: rgba(255, 228, 188, 0.12);
  --line-2: rgba(255, 228, 188, 0.24);
  --text: #f8f0e3;
  --muted: #c2b29c;
  --dim: #8a7c6b;
  --cyan: #7cc4f0; /* info / sky */
  --power: #ffcf3a; /* energised network */
  --lime: #ffc63a; /* primary action, current objective, focus */
  --amber: #ff9f3a;
  --red: #ff5a4e;
  --green: #74d36b;
  --violet: #ff8a4a;
  --terra: #d8642f;
  --radius: 16px;
  --font: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Varela Round', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: calc(14px * var(--scale)); -webkit-font-smoothing: antialiased; }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
#ui > * { pointer-events: auto; }
#ui .passthrough { pointer-events: none; }
#fade { position: fixed; inset: 0; background: #000; z-index: 50; pointer-events: none; opacity: 0; transition: opacity 0.9s ease; }
#fade.on { opacity: 1; }
#nogl, #nojs { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; background: var(--bg); }
#nogl[hidden] { display: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.hidden, [hidden] { display: none !important; }
kbd { font-family: var(--mono); font-size: 0.78em; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.04); color: var(--muted); }

/* ---------- buttons ---------- */
.btn { appearance: none; border: 1px solid var(--line-2); background: rgba(255, 236, 205, 0.07); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.22); color: var(--text); padding: 0.62em 1.1em; border-radius: 999px; cursor: pointer; font-weight: 600; letter-spacing: 0.01em; transition: background 0.15s, border-color 0.15s, transform 0.08s; display: inline-flex; align-items: center; gap: 0.5em; }
.btn:hover { background: rgba(255, 236, 205, 0.14); border-color: rgba(255, 228, 188, 0.4); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--lime); color: #2b1b08; border-color: transparent; box-shadow: inset 0 -3px 0 rgba(140, 70, 0, 0.35), 0 2px 10px rgba(255, 190, 50, 0.18); }
.btn.primary:hover { background: #ffd765; }
.btn.danger { border-color: rgba(255, 90, 78, 0.55); color: #ffd6cf; }
.btn.danger:hover { background: rgba(255, 90, 78, 0.18); }
.btn.small { padding: 0.36em 0.8em; font-size: 0.88em; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn svg { width: 1.1em; height: 1.1em; }

.glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2); box-shadow: inset 0 1px 0 rgba(255, 240, 215, 0.08), 0 12px 36px rgba(0, 0, 0, 0.42); }

/* ---------- top bar ---------- */
#topbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 16px; }
#topbar .brand { font-weight: 800; letter-spacing: 0.18em; font-size: 0.92em; margin-right: 6px; white-space: nowrap; }
#topbar .brand small { display: block; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); font-size: 0.78em; }
.chips { display: flex; gap: 6px; flex: 1; flex-wrap: nowrap; overflow: hidden; }
.chip { display: flex; align-items: center; gap: 8px; padding: 5px 11px; border-radius: 10px; background: var(--panel-2); border: 1px solid transparent; min-width: 0; white-space: nowrap; cursor: default; position: relative; }
.chip[role='button'] { cursor: pointer; }
.chip[role='button']:hover { border-color: var(--line-2); }
.chip .ic { width: 16px; height: 16px; color: var(--power); flex: none; }
.chip .k { font-size: 0.72em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; display: block; line-height: 1.1; }
.chip .v { font-weight: 700; font-variant-numeric: tabular-nums; display: block; line-height: 1.2; }
.chip.warn { border-color: rgba(255, 159, 58, 0.6); }
.chip.warn .ic { color: var(--amber); }
.chip.bad { border-color: rgba(255, 90, 78, 0.65); }
.chip.bad .ic { color: var(--red); }
.chip.good .ic { color: var(--green); }
.chip .bar { position: absolute; left: 10px; right: 10px; bottom: 3px; height: 2px; border-radius: 2px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: var(--power); }
.clockbox { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.clock { font-variant-numeric: tabular-nums; text-align: right; padding: 0 6px; min-width: 92px; }
.clock .day { font-size: 0.72em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.clock .time { font-weight: 700; font-size: 1.15em; }
.clock .frozen { font-size: 0.7em; color: var(--lime); }
.speed { display: flex; gap: 2px; background: var(--panel-2); padding: 3px; border-radius: 10px; }
.speed button { border: 0; background: transparent; color: var(--muted); width: 32px; height: 28px; border-radius: 7px; cursor: pointer; display: grid; place-items: center; }
.speed button svg { width: 15px; height: 15px; }
.speed button.on { background: rgba(255, 198, 58, 0.22); color: var(--text); }
.iconbtn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn:hover { border-color: var(--line-2); }

/* ---------- objectives ---------- */
#objectives { position: absolute; top: 78px; left: 12px; width: 300px; padding: 14px 14px 10px; max-height: calc(100vh - 220px); overflow: auto; }
.panel-title { font-size: 0.72em; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.mission-name { font-weight: 700; font-size: 1.05em; margin: 0 0 10px; }
.obj { display: flex; gap: 9px; align-items: flex-start; padding: 6px 2px; font-size: 0.93em; line-height: 1.3; }
.obj .box { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--dim); flex: none; display: grid; place-items: center; margin-top: 1px; }
.obj.done { color: var(--muted); }
.obj.done .box { border-color: var(--green); background: rgba(116, 211, 107, 0.18); color: var(--green); }
.obj.done .box svg { width: 12px; height: 12px; }
.obj.current { color: var(--text); }
.obj.current .box { border-color: var(--lime); box-shadow: 0 0 0 3px rgba(255, 198, 58, 0.16); }
.obj .prog { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.9em; padding-left: 6px; }
.obj.optional { font-size: 0.86em; color: var(--muted); }
.obj .pbar { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.07); margin-top: 5px; overflow: hidden; }
.obj .pbar i { display: block; height: 100%; background: var(--lime); }
.sep { height: 1px; background: var(--line); margin: 8px 0; }

/* ---------- inspector ---------- */
#inspector { position: absolute; top: 78px; right: 12px; width: 330px; padding: 16px; max-height: calc(100vh - 200px); overflow: auto; }
.insp-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.insp-head .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 198, 58, 0.14); color: var(--lime); flex: none; }
.insp-head .ic svg { width: 22px; height: 22px; }
.insp-head h3 { margin: 0; font-size: 1.08em; }
.insp-head .sub { color: var(--muted); font-size: 0.84em; }
.insp-close { margin-left: auto; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 0.82em; font-weight: 700; border: 1px solid; }
.status-pill svg { width: 13px; height: 13px; }
.st-on { color: var(--green); border-color: rgba(116, 211, 107, 0.45); background: rgba(116, 211, 107, 0.08); }
.st-warn { color: var(--amber); border-color: rgba(255, 159, 58, 0.5); background: rgba(255, 159, 58, 0.08); }
.st-bad { color: var(--red); border-color: rgba(255, 90, 78, 0.5); background: rgba(255, 90, 78, 0.08); }
.st-off { color: var(--muted); border-color: var(--line-2); }
.st-info { color: var(--cyan); border-color: rgba(124, 196, 240, 0.45); }
.why { margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: rgba(255, 236, 205, 0.05); border-left: 3px solid var(--amber); font-size: 0.9em; line-height: 1.4; }
.why.ok { border-left-color: var(--green); }
.why b { display: block; margin-bottom: 3px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 0.92em; margin: 10px 0; }
.kv .k { color: var(--muted); }
.kv .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.meter { height: 7px; border-radius: 7px; background: rgba(255, 255, 255, 0.07); overflow: hidden; margin: 4px 0 2px; position: relative; }
.meter i { display: block; height: 100%; border-radius: 7px; background: var(--green); transition: width 0.3s; }
.meter.amber i { background: var(--amber); }
.meter.red i { background: var(--red); }
.meter .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255, 255, 255, 0.55); }
.meter-label { display: flex; justify-content: space-between; font-size: 0.8em; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.note { font-size: 0.82em; color: var(--muted); margin-top: 8px; line-height: 1.4; }
.seg { display: flex; background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 2px; margin-top: 4px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 8px; cursor: pointer; font-size: 0.85em; font-weight: 600; }
.seg button.on { background: rgba(255, 198, 58, 0.22); color: var(--text); }

/* ---------- toolbar ---------- */
#toolbar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; }
.tool { border: 1px solid transparent; background: transparent; color: var(--text); width: 74px; padding: 8px 4px 6px; border-radius: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.78em; font-weight: 600; position: relative; }
.tool svg { width: 22px; height: 22px; color: var(--muted); }
.tool:hover { background: rgba(255, 255, 255, 0.05); }
.tool.on { background: rgba(255, 198, 58, 0.16); border-color: rgba(255, 198, 58, 0.55); box-shadow: inset 0 -2px 0 rgba(255, 198, 58, 0.25); }
.tool.on svg { color: var(--lime); }
.tool kbd { position: absolute; top: 3px; right: 5px; font-size: 0.72em; padding: 0 4px; }
.tool .sub { font-size: 0.85em; color: var(--muted); font-weight: 500; }
.toolsep { width: 1px; background: var(--line); margin: 6px 4px; }
#inventory { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; padding: 6px 14px; font-size: 0.82em; color: var(--muted); border-radius: 999px; }
#inventory b { color: var(--text); font-variant-numeric: tabular-nums; }
#inventory span.low b { color: var(--amber); }
#hint { position: absolute; bottom: 132px; left: 50%; transform: translateX(-50%); max-width: 640px; text-align: center; font-size: 0.88em; color: var(--muted); padding: 7px 14px; border-radius: 999px; pointer-events: none; }
#hint:empty { display: none; }

/* ---------- cursor tip ---------- */
#cursor-tip { position: fixed; z-index: 6; pointer-events: none; padding: 7px 11px; border-radius: 10px; font-size: 0.85em; max-width: 300px; transform: translate(16px, 16px); line-height: 1.35; }
#cursor-tip.bad { border-color: rgba(255, 84, 104, 0.6); }
#cursor-tip .cost { color: var(--lime); font-weight: 700; }
#cursor-tip.bad .cost { color: var(--red); }

/* ---------- alerts ---------- */
#alerts { position: absolute; top: 78px; right: 354px; width: 320px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#alerts.wide { right: 12px; }
.alert { pointer-events: auto; display: flex; gap: 10px; padding: 11px 12px; border-radius: 12px; border-left: 3px solid var(--amber); animation: slidein 0.35s ease; }
.alert.critical { border-left-color: var(--red); }
.alert.info { border-left-color: var(--cyan); }
.alert.good { border-left-color: var(--green); }
.alert .ic { width: 20px; height: 20px; flex: none; color: var(--amber); margin-top: 1px; }
.alert.critical .ic { color: var(--red); }
.alert.info .ic { color: var(--cyan); }
.alert.good .ic { color: var(--green); }
.alert b { display: block; font-size: 0.95em; }
.alert p { margin: 2px 0 0; font-size: 0.86em; color: var(--muted); line-height: 1.35; }
.alert .acts { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.alert .x { margin-left: auto; background: none; border: 0; color: var(--dim); cursor: pointer; align-self: flex-start; padding: 0 2px; font-size: 1.1em; }
@keyframes slidein { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

/* ---------- comms ---------- */
#comms { position: absolute; left: 12px; bottom: 14px; width: 360px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.msg { display: flex; gap: 10px; padding: 10px 12px; animation: rise 0.35s ease; pointer-events: auto; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.82em; color: #2b1b08; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2); flex: none; }
.msg .who { font-size: 0.78em; color: var(--muted); }
.msg .who b { color: var(--text); font-size: 1.08em; margin-right: 4px; }
.msg p { margin: 2px 0 0; font-size: 0.92em; line-height: 1.38; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ---------- tutorial ---------- */
#tutorial { position: absolute; right: 12px; bottom: 110px; width: 400px; padding: 14px 16px; border: 1px solid rgba(255, 198, 58, 0.45); }
#tutorial .step { font-size: 0.72em; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lime); }
#tutorial h4 { margin: 4px 0 4px; font-size: 1.05em; }
#tutorial p { margin: 0; color: #e6dacb; font-size: 0.92em; line-height: 1.45; }
#tutorial .acts { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; }
.tut-glow { box-shadow: 0 0 0 2px var(--lime), 0 0 22px rgba(255, 198, 58, 0.55) !important; border-radius: 11px; animation: tutpulse 1.2s ease-in-out infinite; }
@keyframes tutpulse { 50% { box-shadow: 0 0 0 2px var(--lime), 0 0 6px rgba(255, 198, 58, 0.2) !important; } }

/* ---------- compass / captions ---------- */
#compass { position: absolute; right: 16px; bottom: 16px; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
#compass svg { width: 34px; height: 34px; transition: transform 0.2s; }
#overlay-legend { position: absolute; right: 80px; bottom: 16px; padding: 8px 12px; font-size: 0.8em; border-radius: 12px; }
#overlay-legend b { display: block; font-size: 0.86em; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
#overlay-legend .row { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
#overlay-legend .sw { width: 22px; height: 6px; border-radius: 3px; }
#captions { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); font-size: 0.82em; color: #f1e6d6; background: rgba(0, 0, 0, 0.55); padding: 3px 10px; border-radius: 6px; pointer-events: none; }
#captions:empty { display: none; }

/* ---------- world labels ---------- */
.wl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: calc(11.5px * var(--scale)); font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(34, 28, 22, 0.88); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); border: 1px solid var(--line-2); color: var(--text); display: flex; align-items: center; gap: 5px; }
.wl svg { width: 13px; height: 13px; }
.wl.bad { border-color: rgba(255, 90, 78, 0.75); color: #ffd6cf; }
.wl.warn { border-color: rgba(255, 159, 58, 0.75); color: #ffe2b5; }
.wl.good { border-color: rgba(116, 211, 107, 0.55); }
.wl.tut { border-color: var(--lime); color: var(--lime); font-size: calc(12.5px * var(--scale)); }
.wl.crew { border-color: rgba(255, 159, 58, 0.55); }
.wl.mini { font-size: calc(10.5px * var(--scale)); padding: 2px 5px; font-weight: 600; }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; }
#intro { display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; cursor: pointer; }
#intro .t { font-size: calc(78px * var(--scale)); font-weight: 800; letter-spacing: 0.22em; margin: 0; opacity: 0; transform: translateY(10px); transition: opacity 1.6s, transform 1.6s; text-shadow: 0 4px 30px rgba(255, 170, 60, 0.35); }
#intro .s { color: #e3d4bf; font-size: 1.15em; opacity: 0; transition: opacity 1.4s 0.8s; margin-top: 10px; }
#intro.show .t { opacity: 1; transform: none; }
#intro.show .s { opacity: 1; }
#intro .skip { position: absolute; bottom: 30px; color: var(--dim); font-size: 0.85em; }
#intro .line { position: absolute; bottom: 90px; max-width: 520px; color: #f1e5d3; opacity: 0; transition: opacity 1s; font-size: 1.05em; }
#intro .line.on { opacity: 1; }

#menu { display: flex; flex-direction: column; justify-content: center; padding: 0 8vw; background: linear-gradient(90deg, rgba(14, 11, 8, 0.9) 0%, rgba(14, 11, 8, 0.6) 38%, rgba(14, 11, 8, 0) 70%); }
#menu .nav { position: absolute; top: 22px; left: 8vw; right: 3vw; display: flex; justify-content: space-between; align-items: center; font-size: 0.76em; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
#menu h1 { font-size: calc(68px * var(--scale)); letter-spacing: -0.02em; margin: 0; line-height: 1; font-weight: 800; }
#menu h1 span { color: var(--lime); }
#menu .tag { color: #e6d8c4; font-size: 1.12em; margin: 14px 0 6px; }
#menu .stage { color: #ff9a4a; font-size: 0.8em; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 28px; }
#menu .items { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
#menu .items .btn { min-width: 220px; justify-content: flex-start; padding: 0.8em 1.3em; font-size: 1.02em; }
#menu .foot { position: absolute; bottom: 22px; left: 8vw; color: var(--dim); font-size: 0.8em; }

.modal-wrap { position: absolute; inset: 0; background: rgba(12, 9, 6, 0.55); display: flex; align-items: center; justify-content: center; z-index: 20; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fadein 0.2s; }
.modal-wrap.side { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; pointer-events: none; justify-content: flex-end; align-items: flex-start; padding: 78px 354px 0 0; }
.modal-wrap.side .modal { pointer-events: auto; }
@keyframes fadein { from { opacity: 0; } }
.modal { width: min(640px, 92vw); max-height: 86vh; overflow: auto; padding: 24px 26px; }
.modal.narrow { width: min(420px, 92vw); }
.modal.wide { width: min(860px, 94vw); }
.modal h2 { margin: 0 0 4px; font-size: 1.45em; letter-spacing: -0.01em; }
.modal .kicker { font-size: 0.74em; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lime); margin-bottom: 6px; }
.modal .kicker.bad { color: var(--red); }
.modal .kicker.info { color: var(--cyan); }
.modal p { color: #e6dacb; line-height: 1.5; }
.modal .row-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.modal .row-actions.center { justify-content: center; }
.tabs { display: flex; gap: 4px; margin: 12px 0 14px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 9px 12px; color: var(--muted); cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--lime); }
.ctable { width: 100%; border-collapse: collapse; font-size: 0.92em; }
.ctable td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
.ctable td:first-child { color: var(--muted); width: 44%; }
.blist { padding-left: 18px; line-height: 1.55; color: #e6dacb; }
.blist li { margin: 4px 0; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setting label { font-weight: 600; }
.setting small { display: block; color: var(--muted); font-weight: 400; font-size: 0.82em; margin-top: 2px; }
.setting input[type='range'] { width: 170px; accent-color: var(--lime); }
.toggle { position: relative; width: 44px; height: 24px; border-radius: 24px; background: rgba(255, 255, 255, 0.12); border: 0; cursor: pointer; flex: none; transition: background 0.2s; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #efe3d1; transition: transform 0.2s; }
.toggle[aria-checked='true'] { background: var(--lime); }
.toggle[aria-checked='true']::after { transform: translateX(20px); background: #2b1b08; }
select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; font: inherit; }

.learn h2 { display: flex; align-items: center; gap: 10px; }
.learn .sec { margin: 12px 0; }
.learn .sec h5 { margin: 0 0 4px; font-size: 0.75em; letter-spacing: 0.13em; text-transform: uppercase; color: var(--lime); }
.learn .sec p, .learn .sec li { margin: 0; color: #ebdfcf; line-height: 1.5; }
.learn .sec ul { margin: 0; padding-left: 18px; }
.learn .real { background: rgba(124, 196, 240, 0.08); border-radius: 10px; padding: 10px 12px; }
.learn .simplified { font-size: 0.78em; color: var(--dim); margin-top: 6px; }

.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.metric { background: rgba(255, 236, 205, 0.05); border-radius: 12px; padding: 10px 12px; }
.metric .k { font-size: 0.72em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.metric .v { font-size: 1.25em; font-weight: 750; margin-top: 3px; font-variant-numeric: tabular-nums; }
.score { display: flex; gap: 18px; align-items: center; margin: 12px 0; }
.score .total { font-size: 3.4em; font-weight: 800; line-height: 1; color: var(--lime); }
.score .total small { font-size: 0.32em; color: var(--muted); font-weight: 600; }
.score .parts { flex: 1; display: grid; gap: 5px; }
.score .part { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 8px; font-size: 0.86em; }
.score .part .meter { margin: 0; }
.score .part .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

#ending { position: absolute; inset: 0; pointer-events: none; }
#ending .bars::before, #ending .bars::after { content: ''; position: absolute; left: 0; right: 0; height: 9vh; background: #000; }
#ending .bars::before { top: 0; }
#ending .bars::after { bottom: 0; }
#ending .narr { position: absolute; left: 50%; bottom: 14vh; transform: translateX(-50%); width: min(760px, 90vw); text-align: center; font-size: 1.28em; line-height: 1.5; color: #fbf3e6; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8); opacity: 0; transition: opacity 1.2s; }
#ending .narr.on { opacity: 1; }
#ending .ttl { position: absolute; top: 18vh; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 1.5s; }
#ending .ttl.on { opacity: 1; }
#ending .ttl .k { color: var(--lime); letter-spacing: 0.2em; font-size: 0.8em; text-transform: uppercase; }
#ending .ttl h2 { font-size: calc(54px * var(--scale)); margin: 6px 0 0; letter-spacing: -0.01em; text-shadow: 0 4px 30px rgba(255, 170, 60, 0.35); }
#ending .end-actions { position: absolute; bottom: 4vh; left: 50%; transform: translateX(-50%); pointer-events: auto; opacity: 0; transition: opacity 1s; display: flex; gap: 10px; }
#ending .end-actions.on { opacity: 1; }
#ending .skipend { position: absolute; top: 2vh; right: 2vw; pointer-events: auto; }

#fps { position: fixed; left: 8px; bottom: 8px; z-index: 60; font: 11px var(--mono); color: var(--lime); background: rgba(0, 0, 0, 0.6); padding: 2px 6px; border-radius: 4px; pointer-events: none; }

@media (max-width: 1180px) {
  #objectives { width: 250px; }
  #inspector { width: 290px; }
  #alerts { right: 312px; width: 270px; }
  .chip { padding: 5px 8px; }
  .chip .k { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
.reduce-motion * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
@media (max-height: 820px) {
  #objectives { max-height: calc(100vh - 340px); padding: 10px 12px 6px; }
  .obj { padding: 4px 2px; }
  #comms .msg:nth-last-child(n + 3) { display: none; }
  #inspector { max-height: calc(100vh - 170px); }
  #tutorial { bottom: 96px; width: 360px; }
}

/* ---------- objective guide card ---------- */
.obj-help { display: flex; align-items: center; gap: 6px; font-size: 0.78em; color: var(--dim); margin: -4px 0 6px; }
.obj-help svg { width: 13px; height: 13px; }
.obj { border-radius: 9px; cursor: help; padding-left: 4px; padding-right: 4px; margin: 0 -4px; transition: background 0.12s; }
.obj:hover, .obj.hover, .obj:focus-visible { background: rgba(255, 236, 205, 0.07); }
.obj .more { width: 15px; height: 15px; flex: none; color: var(--dim); opacity: 0; transition: opacity 0.12s; margin-top: 1px; }
.obj .more svg { width: 15px; height: 15px; }
.obj:hover .more, .obj.hover .more, .obj:focus-visible .more { opacity: 1; color: var(--lime); }
.obj .prog + .more { margin-left: 4px; }
.obj > div[style] + .more { margin-left: auto; }
#objcard { position: absolute; z-index: 8; width: 360px; padding: 14px 16px 14px; max-height: calc(100vh - 90px); overflow: auto; border-color: rgba(255, 198, 58, 0.35); animation: fadein 0.12s; }
#objcard .oc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
#objcard .oc-state { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72em; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lime); }
#objcard .oc-state.done { color: var(--green); }
#objcard .oc-state svg { width: 12px; height: 12px; }
#objcard .oc-pin { font-size: 0.72em; color: var(--dim); }
#objcard h4 { margin: 2px 0 4px; font-size: 1.06em; }
#objcard .oc-why { margin: 0 0 8px; color: var(--muted); font-size: 0.88em; line-height: 1.42; }
#objcard .oc-sec { font-size: 0.7em; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; color: #ff9a4a; margin: 10px 0 5px; }
#objcard .oc-steps { margin: 0; padding-left: 20px; font-size: 0.9em; line-height: 1.45; }
#objcard .oc-steps li { margin: 3px 0; padding-left: 2px; }
#objcard .oc-steps li::marker { color: var(--lime); font-weight: 800; }
#objcard .oc-now { list-style: none; margin: 0; padding: 0; font-size: 0.88em; line-height: 1.38; }
#objcard .oc-now li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 8px; border-radius: 8px; margin: 2px 0; background: rgba(255, 236, 205, 0.04); }
#objcard .oc-now li i { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--dim); }
#objcard .oc-now li.ok i { background: var(--green); }
#objcard .oc-now li.todo i { background: var(--lime); }
#objcard .oc-now li.warn i { background: var(--amber); }
#objcard .oc-now li.warn { background: rgba(255, 159, 58, 0.08); }
#objcard .oc-now li.info i { background: var(--cyan); }
#objcard .oc-tip { display: flex; gap: 8px; margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(124, 196, 240, 0.08); font-size: 0.86em; line-height: 1.4; color: #e6dacb; }
#objcard .oc-tip svg { width: 16px; height: 16px; flex: none; color: var(--cyan); margin-top: 1px; }
#objcard .oc-acts { display: flex; justify-content: flex-end; margin-top: 10px; }
#objcard kbd, .obj kbd { color: var(--text); }
@media (max-width: 1180px) { #objcard { width: 320px; } }

/* ---------- campaign ---------- */
.modal.campaign { width: min(1180px, 96vw); }
.stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 14px; }
.stage-tile { background: rgba(255, 236, 205, 0.05); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.stage-tile.locked { opacity: 0.55; }
.stage-tile .st-n { font-size: 0.72em; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lime); font-weight: 800; }
.stage-tile h3 { margin: 0; font-size: 1.02em; line-height: 1.2; }
.stage-tile .st-region { font-size: 0.78em; color: var(--muted); }
.stage-tile p { font-size: 0.84em; margin: 4px 0; color: #e6dacb; line-height: 1.4; }
.stage-tile .st-learns { margin: 0 0 4px; padding-left: 16px; font-size: 0.78em; color: var(--muted); line-height: 1.4; }
.stage-tile .st-best { font-size: 0.8em; color: var(--muted); display: flex; gap: 5px; align-items: center; margin-top: auto; }
.stage-tile .st-best svg { width: 14px; height: 14px; }
.stage-tile .row-actions { margin-top: 6px; justify-content: flex-start; }
@media (max-width: 1180px) { .stages { grid-template-columns: repeat(3, 1fr); } }
.tariff-row { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 6px; align-items: center; margin: 4px 0; font-size: 0.9em; }
.tariff-row .tl { color: var(--text); }
.tariff-row .tb { color: var(--muted); font-size: 0.82em; }
.tariff-row b { font-variant-numeric: tabular-nums; min-width: 58px; text-align: center; }
.tariff-row .btn.small { padding: 0.2em 0.6em; }
.build-opt { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 236, 205, 0.05); }
</style>
</head>

ney",body:"Credits ran out before the network could earn revenue.",tip:"Plan the shortest route first and power customers early so billing starts."},deadline:{title:"Out of time",body:"The district wasn\u2019t stable by the end of day 5.",tip:"Connect everyone early, split load across transformers, and respond to faults quickly."}},endings:{sustainable:"Sustainable Grid",reliable:"Reliable Grid",hardwon:"Hard-won Grid"},help:{controls:[["Left click","Select \xB7 place \xB7 confirm"],["Left or right drag","Move around the map"],["Right click","Cancel current tool"],["W A S D / arrows / screen edge","Pan camera"],["Mouse wheel","Zoom"],["Q / E","Rotate camera 90\xB0"],["Home","Reset camera"],["Space","Pause / resume time"],["1 / 2 / 3","Speed \xD71 / \xD72 / \xD73"],["Esc","Pause menu (closes dialogs first)"],["Delete / Backspace","Remove selected asset (asks first)"],["V L T C X O","Select \xB7 Line \xB7 Transformer \xB7 Service drop \xB7 Remove \xB7 Overlay"]],building:["The generator outputs <b>11 kV</b> (medium voltage, MV). Homes use <b>400 V</b> (low voltage, LV).","Use the <b>Line</b> tool from the generator to bring 11 kV toward town. Poles are added automatically every 40 m or less.","Mount a <b>Transformer</b> on an 11 kV pole. Lines drawn out of a transformer carry 400 V.","Connect each building with a <b>Service drop</b> from a 400 V pole within 22 m.","A line touching a building does nothing \u2014 a building lights up only when real power reaches it.","Each transformer is rated <b>40 kW</b>. Split the town between transformers so none is overloaded at the evening peak."],basics:["<b>Power (kW)</b> is how fast electricity is used right now. <b>Energy (kWh)</b> is power over time \u2014 customers are billed for kWh.","<b>Demand</b> changes through the day: homes peak in the evening, the school and market by day, the clinic never stops.","<b>Capacity</b> is the most an asset can safely carry. Overloaded transformers heat up and trip to protect themselves.","<b>Losses</b>: some energy turns to heat in lines and transformers (a simplified model in this game).","<b>Fuel</b>: the diesel generator burns 1 unit per ~20 kWh. Deliveries take 6 hours."],objectives:["Connect all 13 customers and start the generator.","Earn revenue \u2014 bills are paid each midnight at 0.40 \xA2/kWh.","Maintain your assets and respond to faults: find, isolate, repair, restore.","Win by keeping all 13 powered for 24 hours after the fault is repaired (by the end of day 5).","You fail if the clinic is dark for 6 h, fuel runs out with nothing on order for 3 h, or money runs out before you can earn."]},credits:[["Design & development","Gridforge team"],["Built with","Three.js (MIT) \xB7 WebAudio \xB7 hand-written simulation"],["Art & audio","Procedurally generated in the browser \u2014 no external assets"],["Note","Numbers are simplified, illustrative values (GDD \xA720) \u2014 not engineering data."]]},ve={kw:n=>Math.abs(n)>=1e3?`${(n/1e3).toFixed(n>=1e4?1:2)} MW`:`${Math.abs(n)<10?n.toFixed(1):Math.round(n)} kW`,kwh:n=>n>=1e5?`${(n/1e3).toFixed(1)} MWh`:`${n<100?n.toFixed(1):Math.round(n).toLocaleString("en-US")} kWh`,cr:n=>`${Math.round(n).toLocaleString("en-US")} \xA2`,pct:n=>`${Math.round(n)}%`,clock:n=>{let e=Math.floor(n/1440)+1,t=Math.floor(n%1440/60),i=Math.floor(n%60);return{day:e,time:`${String(t).padStart(2,"0")}:${String(i).padStart(2,"0")}`}},dur:n=>n>=60?`${Math.floor(n/60)} h ${String(Math.round(n%60)).padStart(2,"0")} min`:`${Math.round(n)} min`};var hh={advisor:{name:"Grid Advisor",role:"AI operations assistant",color:"#7cc4f0",initials:"GA"},sofia:{name:"Sofia Reyes",role:"Chief grid engineer",color:"#ff9f3a",initials:"SR"},daniel:{name:"Daniel Carter",role:"Financial advisor",color:"#74d36b",initials:"DC"},maya:{name:"Maya Rahman",role:"Community representative",color:"#ff7eb6",initials:"MR"}},fh={firstLight:{title:"First light",what:"Electricity is flowing from the generator, through 11 kV lines and a transformer, into homes at s."],real:"A 1 kW heater running for 3 hours uses 3 kWh. Utilities bill energy but must build for the peak."},fault:{title:"Transformer fault",what:"{name} has failed. {count} customers it feeds are without power{clinic}.",why:"An internal fault \u2014 insulation that had been overheating finally broke down. The protection isolated it so the rest of the network stays safe.",todo:["Focus on the transformer and send the repair crew (1 kit + 200 \xA2).","The crew needs to drive from the depot, then 2 hours on site.","The clinic must not be dark for more than 6 hours."],real:"Outage response: Alert \u2192 Locate \u2192 Isolate \u2192 Repair \u2192 Restore \u2192 Review. Utilities track restoration time closely."},restored:{title:"Service restored \u2014 review",what:"{name} is repaired and back in service. Restoration took {dur}.",why:"The fault was isolated to one transformer, so only its customers lost power \u2014 the rest of the network kept running.",todo:["Preventive maintenance lowers wear-related risk.","Pre-dispatching the crew when a unit overheats shortens outages.","Keep all 13 customers powered for 24 hours to complete the mission."],real:"Redundancy \u2014 a second path or spare capacity \u2014 lets operators reroute power around a failed asset."},noFuel:{title:"Out of fuel",what:"The generator has stopped: the fuel tank is empty.",why:"Diesel generators burn fuel in proportion to the energy they produce \u2014 about 1 unit per 20 kWh here.",todo:["Order fuel from the generator panel (50 units, 250 \xA2, arrives in 6 h).","The generator restarts automatically when fuel arrives."],real:"Fuel logistics are a real risk for remote, diesel-powered grids \u2014 one reason towns invest in renewables and storage."}},gu={intro:[["advisor","You\u2019re the new operator. 13 customers, 0 powered. Let\u2019s change that."]],tutorialDone:[["advisor","You know the basics. Connect everyone \u2014 and watch the transformer loads before the evening peak."]],firstLight:[["ma
